quarkus.application.name=quiz-service
quarkus.http.port=${HTTP_PORT:8083}

# PostgreSQL — temporary shared local DB (later: quiz_db)
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USERNAME:postgres}
quarkus.datasource.password=${DB_PASSWORD:postgres}
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5433/clabs}

# Flyway — shared kahoot_db uses one history table; migrations are V1–V4 across services
quarkus.flyway.migrate-at-start=false
quarkus.flyway.locations=classpath:db/migration
quarkus.flyway.table=history
quarkus.flyway.baseline-on-migrate=true
quarkus.flyway.out-of-order=true
quarkus.flyway.ignore-missing-migrations=true

quarkus.hibernate-orm.schema-management.strategy=validate
quarkus.hibernate-orm.log.sql=${HIBERNATE_LOG_SQL:false}

# MongoDB — temporary shared local read DB (later: quiz_read_db)
quarkus.mongodb.connection-string=${MONGO_URI:mongodb://localhost:27028}
quarkus.mongodb.database=${MONGO_DATABASE:clabs2}
quarkus.mongodb.uuid-representation=standard

kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
mp.messaging.connector.smallrye-kafka.bootstrap.servers=${kafka.bootstrap.servers}

mp.messaging.outgoing.quiz-events.connector=smallrye-kafka
mp.messaging.outgoing.quiz-events.topic=quiz.events
mp.messaging.outgoing.quiz-events.key.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.quiz-events.value.serializer=io.quarkus.kafka.client.serialization.ObjectMapperSerializer

mp.messaging.outgoing.quiz-read-events-out.connector=smallrye-kafka
mp.messaging.outgoing.quiz-read-events-out.topic=quiz.read.events
mp.messaging.outgoing.quiz-read-events-out.key.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.quiz-read-events-out.value.serializer=io.quarkus.kafka.client.serialization.ObjectMapperSerializer

mp.messaging.incoming.quiz-read-events-in.connector=smallrye-kafka
mp.messaging.incoming.quiz-read-events-in.topic=quiz.read.events
mp.messaging.incoming.quiz-read-events-in.group.id=quiz-read-projection
mp.messaging.incoming.quiz-read-events-in.auto.offset.reset=earliest
mp.messaging.incoming.quiz-read-events-in.enable.auto.commit=false
mp.messaging.incoming.quiz-read-events-in.key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.quiz-read-events-in.value.deserializer=kahoot.clabs.quiz.infrastructure.messaging.kafka.QuizReadModelIntegrationEventDeserializer

app.seed.enabled=true
%dev.app.seed.enabled=true

quarkus.datasource.devservices.enabled=false
quarkus.mongodb.devservices.enabled=false
quarkus.kafka.devservices.enabled=false

%dev.quarkus.log.category."kahoot.clabs".level=DEBUG

%test.quarkus.http.test-port=0
%test.quarkus.datasource.devservices.enabled=false
%test.quarkus.mongodb.devservices.enabled=false
%test.quarkus.kafka.devservices.enabled=false
%test.quarkus.hibernate-orm.schema-management.strategy=validate

app.storage=${APP_STORAGE:aws}
storage.s3.bucket=${AWS_S3_BUCKET:}
storage.s3.region=${AWS_REGION:us-east-2}
storage.s3.public-base-url=${AWS_S3_PUBLIC_BASE_URL:}
storage.azure.connection-string=${AZURE_STORAGE_CONNECTION_STRING:}
storage.azure.container=${AZURE_STORAGE_CONTAINER:}
storage.azure.account-name=${AZURE_STORAGE_ACCOUNT:}
storage.azure.public-base-url=${AZURE_STORAGE_PUBLIC_BASE_URL:}

quarkus.smallrye-openapi.path=/q/openapi
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/swagger-ui
mp.openapi.extensions.smallrye.info.title=Quiz Service API
mp.openapi.extensions.smallrye.info.version=1.0.0
mp.openapi.extensions.smallrye.info.description=Quizzes, categories, questions and assets
