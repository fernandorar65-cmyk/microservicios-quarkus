# Local development infrastructure for Kahoot CLABS microservices.
#
# Usage:
#   cd infrastructure
#   docker compose up -d
#
# Postgres is published on host port 5433 to avoid conflicts with other local
# Postgres instances that may already use 5432.
# JDBC URLs in each service default to localhost:5433.
#
# MongoDB is published on host port 27018 to avoid conflicts with a local
# mongod that may already use 27017.
# Connection strings in each service default to localhost:27018.
#
# Databases (tables owned by each service Flyway):
#   identity_db, organization_db, quiz_db, gameplay_db
#
# MongoDB logical DBs (created on first use):
#   identity_read_db, organization_read_db, quiz_read_db, gameplay_read_db

services:
  postgres:
    image: postgres:16-alpine
    container_name: kahoot-ms-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init-databases.sql:/docker-entrypoint-initdb.d/01-init-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongodb:
    image: mongo:7
    container_name: kahoot-mongodb
    command: mongod --port 27027
    ports:
      - "27028:27027"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Kafka-compatible broker (Redpanda) prepared for a later messaging stage — no topics here.
  kafka:
    image: redpandadata/redpanda:v24.3.1
    container_name: kahoot-kafka
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp
      - "1"
      - --memory
      - 512M
      - --reserve-memory
      - 0M
      - --node-id
      - "0"
      - --check=false
      - --kafka-addr
      - internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr
      - internal://kafka:9092,external://localhost:9092
      - --mode
      - dev-container
    ports:
      - "9092:19092"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10

volumes:
  postgres_data:
  mongodb_data:
