quarkus.application.name=identity-service
quarkus.http.port=${HTTP_PORT:8081}

# PostgreSQL — temporary shared local DB (later: identity_db)
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USERNAME:postgres}
quarkus.datasource.password=${DB_PASSWORD:postgres}
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5433/kahoot_db}

# Flyway — shared kahoot_db uses one history table; migrations are V1–V4 across services
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=classpath:db/migration
quarkus.flyway.table=history
quarkus.flyway.baseline-on-migrate=true
quarkus.flyway.out-of-order=true
quarkus.flyway.ignore-missing-migrations=true

# Hibernate validates schema created by Flyway (never create/drop)
quarkus.hibernate-orm.schema-management.strategy=validate
quarkus.hibernate-orm.log.sql=${HIBERNATE_LOG_SQL:false}

# MongoDB — temporary shared local read DB (later: identity_read_db)
quarkus.mongodb.connection-string=${MONGO_URI:mongodb://localhost:27028/clabs2}
# quarkus.mongodb.connection-string=${MONGODB_URI:mongodb://localhost:27017/clabs2}
quarkus.mongodb.database=${MONGO_DATABASE:clabs2}
quarkus.mongodb.uuid-representation=standard

# Kafka (Redpanda)
kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
mp.messaging.connector.smallrye-kafka.bootstrap.servers=${kafka.bootstrap.servers}

mp.messaging.outgoing.user-created-out.connector=smallrye-kafka
mp.messaging.outgoing.user-created-out.topic=identity.user.created
mp.messaging.outgoing.user-created-out.key.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.user-created-out.value.serializer=io.quarkus.kafka.client.serialization.ObjectMapperSerializer

mp.messaging.incoming.user-created-in.connector=smallrye-kafka
mp.messaging.incoming.user-created-in.topic=identity.user.created
mp.messaging.incoming.user-created-in.group.id=identity-user-projection
mp.messaging.incoming.user-created-in.auto.offset.reset=earliest
mp.messaging.incoming.user-created-in.enable.auto.commit=false
mp.messaging.incoming.user-created-in.key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.user-created-in.value.deserializer=kahoot.clabs.infrastructure.messaging.kafka.UserCreatedEventDeserializer

quarkus.datasource.devservices.enabled=false
quarkus.mongodb.devservices.enabled=false
quarkus.kafka.devservices.enabled=false

%dev.quarkus.log.category."kahoot.clabs".level=DEBUG

%test.quarkus.http.test-port=0
%test.quarkus.datasource.devservices.enabled=false
%test.quarkus.mongodb.devservices.enabled=false
%test.quarkus.kafka.devservices.enabled=false
%test.quarkus.hibernate-orm.schema-management.strategy=validate

app.storage=${APP_STORAGE:aws}
storage.s3.bucket=${AWS_S3_BUCKET:}
storage.s3.region=${AWS_REGION:us-east-2}
storage.s3.public-base-url=${AWS_S3_PUBLIC_BASE_URL:}
storage.azure.connection-string=${AZURE_STORAGE_CONNECTION_STRING:}
storage.azure.container=${AZURE_STORAGE_CONTAINER:}
storage.azure.account-name=${AZURE_STORAGE_ACCOUNT:}
storage.azure.public-base-url=${AZURE_STORAGE_PUBLIC_BASE_URL:}

quarkus.smallrye-openapi.path=/q/openapi
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/swagger-ui
mp.openapi.extensions.smallrye.info.title=Identity Service API
mp.openapi.extensions.smallrye.info.version=1.0.0
mp.openapi.extensions.smallrye.info.description=Auth, users, roles and permissions
