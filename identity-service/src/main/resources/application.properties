# Datasource — identity_db is owned exclusively by identity-service
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USERNAME:postgres}
quarkus.datasource.password=${DB_PASSWORD:postgres}

# Explicit JDBC URL only for dev/prod. Tests rely on Quarkus Dev Services (no URL).
%dev.quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/identity_db}
%prod.quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/identity_db}

# Flyway owns the schema
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=classpath:db/migration

# Hibernate must not create or drop tables — schema evolves via Flyway
quarkus.hibernate-orm.schema-management.strategy=none
quarkus.hibernate-orm.log.sql=${HIBERNATE_LOG_SQL:false}

%test.quarkus.http.port=0
quarkus.http.test-port=0

quarkus.http.port=8081
