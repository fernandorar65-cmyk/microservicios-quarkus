quarkus.application.name=gameplay-service
quarkus.http.port=${HTTP_PORT:8084}

# PostgreSQL — write model (gameplay_db)
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USERNAME:postgres}
quarkus.datasource.password=${DB_PASSWORD:postgres}
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5433/gameplay_db}

# Flyway owns schema evolution
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=classpath:db/migration

# Hibernate validates schema created by Flyway (never create/drop)
quarkus.hibernate-orm.schema-management.strategy=validate
quarkus.hibernate-orm.log.sql=${HIBERNATE_LOG_SQL:false}

# MongoDB — read model (gameplay_read_db)
quarkus.mongodb.connection-string=${MONGO_URI:mongodb://localhost:27028/?retryWrites=false}
quarkus.mongodb.database=${MONGO_DATABASE:gameplay_read_db}
# Required when documents/queries use java.util.UUID (@BsonId, filters, etc.)
quarkus.mongodb.uuid-representation=standard

# Kafka (Redpanda) — quiz.events incoming (QuizPublished → local snapshot)
kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
mp.messaging.connector.smallrye-kafka.bootstrap.servers=${kafka.bootstrap.servers}

mp.messaging.incoming.quiz-published-in.connector=smallrye-kafka
mp.messaging.incoming.quiz-published-in.topic=quiz.events
mp.messaging.incoming.quiz-published-in.group.id=gameplay-service
mp.messaging.incoming.quiz-published-in.auto.offset.reset=earliest
mp.messaging.incoming.quiz-published-in.enable.auto.commit=false
mp.messaging.incoming.quiz-published-in.key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.quiz-published-in.value.deserializer=kahoot.clabs.infrastructure.messaging.kafka.QuizPublishedIntegrationEventDeserializer
mp.messaging.incoming.quiz-published-in.failure-strategy=ignore

# Prefer local Docker Compose over Dev Services
quarkus.datasource.devservices.enabled=false
quarkus.mongodb.devservices.enabled=false
quarkus.kafka.devservices.enabled=false

# --- Profiles ---
%dev.quarkus.log.category."kahoot.clabs".level=DEBUG

# Tests also use Docker Compose infrastructure + Flyway (no drop-and-create)
%test.quarkus.http.test-port=0
%test.quarkus.datasource.devservices.enabled=false
%test.quarkus.mongodb.devservices.enabled=false
%test.quarkus.kafka.devservices.enabled=false
%test.quarkus.hibernate-orm.schema-management.strategy=validate

# Seed (local demo only — keep false in test/prod unless intentional)
app.seed.enabled=${APP_SEED_ENABLED:true}
app.seed.admin.email=${APP_SEED_ADMIN_EMAIL:admin@kahoot-clabs.local}
app.seed.admin.password=${APP_SEED_ADMIN_PASSWORD:Admin123!}
app.seed.admin.first-name=${APP_SEED_ADMIN_FIRST_NAME:System}
app.seed.admin.last-name=${APP_SEED_ADMIN_LAST_NAME:Admin}
%test.app.seed.enabled=false

# OpenAPI / Swagger UI
quarkus.smallrye-openapi.path=/q/openapi
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/swagger-ui
mp.openapi.extensions.smallrye.info.title=Gameplay Service API
mp.openapi.extensions.smallrye.info.version=1.0.0
mp.openapi.extensions.smallrye.info.description=Game sessions, answers and leaderboard
